<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Фон: тёмный квадрат -->
  <rect width="512" height="512" rx="96" fill="#0f172a"/>
  <!-- Рамка акцент -->
  <rect x="32" y="32" width="448" height="448" rx="72" fill="none" stroke="#38bdf8" stroke-width="8"/>
  <!-- Буквы ETT -->
  <text x="256" y="290" font-family="Inter, Arial, sans-serif" font-size="180" font-weight="800"
        text-anchor="middle" fill="#ffffff" letter-spacing="-4">ETT</text>
  <!-- Эмодзи книги (упрощённая иконка) -->
  <g transform="translate(356, 120) scale(0.9)">
    <rect x="0" y="0" width="64" height="48" rx="6" fill="#38bdf8"/>
    <line x1="32" y1="0" x2="32" y2="48" stroke="#0f172a" stroke-width="3"/>
    <rect x="6" y="6" width="20" height="36" fill="#0f172a" opacity="0.3"/>
    <rect x="38" y="6" width="20" height="36" fill="#0f172a" opacity="0.3"/>
  </g>
  <!-- Подпись снизу -->
  <text x="256" y="380" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="600"
        text-anchor="middle" fill="#38bdf8">English Today</text>
  <text x="256" y="420" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400"
        text-anchor="middle" fill="#94a3b8">and Tomorrow</text>
</svg>
